# Alvo de laboratório para o hardening (caso GHS) em qualquer sistema, inclusive macOS:
# um "servidor" Debian que é só um container Podman.
#   podman run -d --name ghs-01 docker.io/library/python:3.12-slim sleep infinity
#   ansible-playbook -i inventario-container.ini hardening.yml --check --diff --skip-tags pacotes
#   podman rm -f ghs-01
[servidores]
ghs-01 ansible_connection=containers.podman.podman ansible_become=false ansible_python_interpreter=python3
